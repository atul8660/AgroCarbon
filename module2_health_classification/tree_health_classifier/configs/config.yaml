# =============================================================
# Tree Health Classification — Central Configuration
# =============================================================

project:
  name: "tree_health_classifier"
  seed: 42
  device: "cuda"        # "cuda" or "cpu" — auto-fallback handled in code

paths:
  raw_data_dir: "data/raw"                 # downloaded/extracted raw datasets
  processed_data_dir: "data/processed"     # unified <health_class>/*.jpg structure
  splits_dir: "data/splits"                # train.csv / val.csv / test.csv
  output_dir: "outputs"
  checkpoint_dir: "outputs/checkpoints"
  log_dir: "outputs/logs"
  plots_dir: "outputs/plots"
  tb_log_dir: "outputs/tb_logs"            # TensorBoard event files

# -------------------------------------------------------------
# Unified health taxonomy. Maps a canonical health class to the
# list of raw source subfolders (from the various datasets) that
# should be merged into it. Extend this to add more sources or
# populate Nutrient_Deficient / Pest_Affected once domain-specific
# data is collected (see README section 6).
# -------------------------------------------------------------
class_map:
  Healthy:
    - "plantvillage/Apple___healthy"
    - "plantvillage/Corn___healthy"
    - "plantvillage/Grape___healthy"
    - "plantvillage/Tomato___healthy"
    - "plantvillage/Potato___healthy"
    - "plantvillage/Peach___healthy"
    - "plantvillage/Strawberry___healthy"
    - "plantdoc/healthy"
    - "plant_pathology_2021/healthy"

  Diseased:
    - "plantvillage/Apple___Apple_scab"
    - "plantvillage/Apple___Black_rot"
    - "plantvillage/Apple___Cedar_apple_rust"
    - "plantvillage/Corn___Common_rust"
    - "plantvillage/Corn___Northern_Leaf_Blight"
    - "plantvillage/Grape___Black_rot"
    - "plantvillage/Grape___Esca_(Black_Measles)"
    - "plantvillage/Tomato___Early_blight"
    - "plantvillage/Tomato___Late_blight"
    - "plantvillage/Tomato___Leaf_Mold"
    - "plantvillage/Tomato___Septoria_leaf_spot"
    - "plantvillage/Potato___Early_blight"
    - "plantvillage/Potato___Late_blight"
    - "plantdoc/leaf_spot"
    - "plantdoc/rust"
    - "plantdoc/blight"
    - "plant_pathology_2021/scab"
    - "plant_pathology_2021/rust"
    - "plant_pathology_2021/powdery_mildew"
    - "plant_pathology_2021/frog_eye_leaf_spot"
    - "plant_pathology_2021/complex"

  Nutrient_Deficient:
    # No public tree-specific dataset at scale — populate this folder with
    # domain-collected data, then list the source subfolder(s) here.
    - "custom/nutrient_deficient"

  Pest_Affected:
    # No public tree-specific dataset at scale — populate this folder with
    # domain-collected data (e.g. filtered PlantDoc "insect" classes, or
    # field-collected images), then list the source subfolder(s) here.
    - "plantdoc/pest_damage"
    - "custom/pest_affected"

  # "Unknown" is intentionally NOT trained as a class — see README section 5.
  # It is produced at inference time via confidence thresholding.

data:
  image_size: 300           # EfficientNet-B3 native input resolution
  num_workers: 8
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  min_images_per_class: 20  # classes with fewer images are dropped/flagged

model:
  backbone: "efficientnet_b3"   # timm model name; swap to convnext_tiny / vit_small_patch16_224
  pretrained: true
  drop_rate: 0.3
  drop_path_rate: 0.2

train:
  epochs: 50
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  warmup_epochs: 3
  early_stopping_patience: 8
  early_stopping_metric: "val_macro_f1"
  use_amp: true
  use_weighted_sampler: true
  grad_clip_norm: 5.0

inference:
  confidence_threshold: 0.55   # below this -> "Unknown"
