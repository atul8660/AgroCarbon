# =============================================================
# Whole Tree Detection — PILOT Configuration
# =============================================================
# Module 3 is architecturally species-agnostic (single-class "tree"
# detector), so the "pilot" here isn't about Mango/Neem at all -- it's
# about starting with the smallest realistic amount of real data instead
# of the full multi-source merge, to prove the pipeline works end-to-end
# before investing in Auto Arborist / NEON's heavier manual setup.
#
# For the pilot, only populate:
#   data/raw/open_images_tree/<ImageID>.jpg + a CSV of boxes
# You do NOT need to populate auto_arborist/ or neon_tree_eval/ -- both are
# handled by prepare_dataset.py's existing "missing source dir -> skipped
# with a warning" behavior (see data/prepare_dataset.py), so leaving them
# empty is safe and expected for the pilot.
#
# Usage:
#   python data/prepare_dataset.py --config configs/config.pilot.yaml
#   python data/make_splits.py --config configs/config.pilot.yaml
#   python training/train.py --config configs/config.pilot.yaml
# =============================================================

project:
  name: "tree_detection_pilot"
  seed: 42
  device: "cuda"

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed_pilot"
  splits_dir: "data/splits_pilot"
  output_dir: "outputs_pilot"
  checkpoint_dir: "outputs_pilot/checkpoints"
  log_dir: "outputs_pilot/logs"
  plots_dir: "outputs_pilot/plots"
  crops_dir: "outputs_pilot/crops"

classes:
  - "tree"

# Only open_images_tree needs a populated raw_subdir for the pilot.
sources:
  auto_arborist:
    raw_subdir: "auto_arborist"
    format: "auto_arborist_json"
  open_images_tree:
    raw_subdir: "open_images_tree"
    format: "open_images_csv"
  neon_tree_eval:
    raw_subdir: "neon_tree_eval"
    format: "pascal_voc_xml"

data:
  image_size: 640              # smaller than full config's 960 -- faster pilot training
  num_workers: 4
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  min_box_size_px: 20
  max_boxes_per_image: 50

model:
  architecture: "yolo11n"       # smaller than full config's yolo11m -- faster pilot training/iteration
  pretrained_weights: "yolo11n.pt"
  input_size: 640

train:
  epochs: 40                    # reduced from 100
  batch_size: 8                 # reduced from 16 -- pilot dataset may be small
  lr0: 0.01
  lrf: 0.01
  weight_decay: 0.0005
  warmup_epochs: 2
  patience: 8                   # reduced from 15
  use_amp: true
  optimizer: "auto"
  augmentation:
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    degrees: 10.0
    translate: 0.1
    scale: 0.5
    shear: 2.0
    flipud: 0.1
    fliplr: 0.5
    mosaic: 1.0
    mixup: 0.1

evaluation:
  conf_threshold: 0.25
  iou_threshold: 0.5

inference:
  min_confidence: 0.35
  crop_padding_ratio: 0.15
  min_crop_resolution: 640

selection:
  area_weight: 0.7
  center_weight: 0.3
