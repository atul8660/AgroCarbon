# ── Gradle JVM ─────────────────────────────────────────────────────────────
# Java 21 requires --add-opens for Gradle internal reflection.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=320m -XX:+HeapDumpOnOutOfMemoryError --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED

# ── Kotlin Compiler ─────────────────────────────────────────────────────────
# CRITICAL FIX: Kotlin incremental compilation fails on Windows when the project
# is on a different drive (D:) than the Gradle user home/PUB_CACHE (C:).
# The Kotlin daemon throws IllegalArgumentException: "this and base files have
# different roots" because it cannot compute relative paths across drive letters.
# Disabling incremental mode forces a full clean compile and eliminates this.
kotlin.incremental=false

# Suppress noisy daemon-compilation warnings that clutter the build log.
kotlin.daemon.jvm.options=-Xmx2G

# ── Android ─────────────────────────────────────────────────────────────────
android.useAndroidX=true
# Suppress deprecation warnings during R8/D8 processing.
android.suppressUnsupportedCompileSdk=36
